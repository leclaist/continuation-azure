name: Update Ruby and dependencies

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      branch: ${{ steps.commit.outputs.branch }}
      pr_number: ${{ steps.pr.outputs.number }}
      major_bump: ${{ steps.majorcheck.outputs.major_bump }}
      remediated: ${{ steps.majorcheck.outputs.remediated }}
    steps:
      - uses: actions/checkout@v6

      - name: Snapshot current lockfile
        run: cp Gemfile.lock /tmp/Gemfile.lock.before

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Audit current dependencies
        id: pre_audit
        run: |
          if bin/bundler-audit 2>&1 | tee /tmp/pre-audit.txt; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=vulnerable" >> "$GITHUB_OUTPUT"
          fi

      - name: Find latest stable Ruby
        id: ruby
        run: |
          today=$(date +%Y-%m-%d)
          latest=$(curl -fsSL "https://endoflife.date/api/ruby.json" | \
            jq -r --arg today "$today" \
            '[.[] | select(.eol == false or .eol > $today)] |
            sort_by(.latest | split(".") | map(tonumber)) | last | .latest')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"

      - name: Update .ruby-version and Dockerfiles
        run: |
          echo "${{ steps.ruby.outputs.latest }}" > .ruby-version
          sed -i "s/^ARG RUBY_VERSION=.*/ARG RUBY_VERSION=${{ steps.ruby.outputs.latest }}/" Dockerfile Dockerfile.dev

      - name: Set up updated Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby.outputs.latest }}
          bundler-cache: false

      - name: Update all gems
        run: |
          bundle config set --local frozen false
          bundle update --all

      - name: Detect and remediate major version bumps
        id: majorcheck
        run: |
          cat > /tmp/majorcheck.rb <<'RUBY'
          require "fileutils"

          def versions(path)
            File.read(path).scan(/^ {4}(\S+) \(([\d]+(?:\.[\d]+)*)/).each_with_object({}) { |(n, v), h| h[n] = v }
          end

          def report(output, major_bump:, remediated: false, note: "")
            File.write("/tmp/major-bumps.txt", note)
            File.open(output, "a") do |f|
              f.puts "major_bump=#{major_bump}"
              f.puts "remediated=#{remediated}"
            end
          end

          before_path = "/tmp/Gemfile.lock.before"
          before = versions(before_path)
          after  = versions("Gemfile.lock")
          output = ENV.fetch("GITHUB_OUTPUT")

          bumps = after.filter_map do |gem, new_v|
            old_v = before[gem]
            next unless old_v
            next if old_v.split(".").first == new_v.split(".").first
            [gem, old_v, new_v]
          end

          if bumps.empty?
            puts "No major version bumps."
            report(output, major_bump: false)
            exit 0
          end

          puts "Major version bumps detected:"
          bumps.each { |g, o, n| puts "  #{g}: #{o} -> #{n}" }

          gemfile = File.read("Gemfile")
          pinnable = bumps.reject { |g, _, _| gemfile =~ /^gem\s+["']#{Regexp.escape(g)}["']/ }

          if pinnable.empty?
            puts "Every bumped gem is already an explicit Gemfile dependency — skipping auto-remediation."
            report(output, major_bump: true, note: bumps.map { |g, o, n| "#{g}: #{o} -> #{n}" }.join("\n"))
            exit 0
          end

          puts "Attempting remediation by pinning: #{pinnable.map(&:first).join(', ')}"
          FileUtils.cp(before_path, "Gemfile.lock")

          File.open("Gemfile", "a") do |f|
            f.puts
            f.puts "# Auto-pinned by the weekly dependency update after bundle update tried to"
            f.puts "# jump a major version. Review the new major and remove this pin when ready."
            pinnable.each { |g, o, _| f.puts %(gem "#{g}", "< #{o.split(".").first.to_i + 1}") }
          end

          system("bundle update --all", exception: true)

          after2 = versions("Gemfile.lock")
          remaining = after2.filter_map do |gem, new_v|
            old_v = before[gem]
            next unless old_v
            next if old_v.split(".").first == new_v.split(".").first
            "#{gem}: #{old_v} -> #{new_v}"
          end

          if remaining.empty?
            puts "Remediation succeeded."
            note = pinnable.map { |g, o, _| "#{g}: held below #{o.split(".").first.to_i + 1} (bundle update wanted to jump past it)" }.join("\n")
            report(output, major_bump: false, remediated: true, note: note)
          else
            puts "Remediation did not fully resolve — still has major bumps:"
            remaining.each { |b| puts "  #{b}" }
            report(output, major_bump: true, note: bumps.map { |g, o, n| "#{g}: #{o} -> #{n}" }.join("\n"))
          end
          RUBY
          ruby /tmp/majorcheck.rb

      - name: Record Rails version
        run: bundle list | grep '* rails ' | awk '{print $3}' | tr -d '()' > /tmp/rails-version.txt

      - name: Audit updated dependencies
        run: bin/bundler-audit 2>&1 | tee /tmp/post-audit.txt

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="automated/dependencies-$(date +%Y-%m-%d)"
          git checkout -b "$branch"
          git add .ruby-version Dockerfile Dockerfile.dev Gemfile Gemfile.lock
          git commit -m "chore: update Ruby to ${{ steps.ruby.outputs.latest }} and gem dependencies"
          git push --force origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open pull request
        id: pr
        if: steps.diff.outputs.changed == 'true'
        run: |
          rails_version=$(cat /tmp/rails-version.txt)
          branch="${{ steps.commit.outputs.branch }}"

          {
            if [ "${{ steps.majorcheck.outputs.major_bump }}" = "true" ]; then
              echo "## ⚠️ Major version bump — needs manual review"
              echo
              echo "At least one gem crossed a major version boundary. Auto-merge and the production/Azure deploys are skipped until this is reviewed and merged by hand."
              echo
              echo '```'
              cat /tmp/major-bumps.txt
              echo '```'
              echo
            elif [ "${{ steps.majorcheck.outputs.remediated }}" = "true" ]; then
              echo "## 🔧 Major version bump auto-remediated"
              echo
              echo "\`bundle update\` tried to jump at least one gem across a major version boundary. It's been pinned below that in the Gemfile and everything else updated normally, so this PR proceeds through auto-merge as usual."
              echo
              echo '```'
              cat /tmp/major-bumps.txt
              echo '```'
              echo
              echo "Remove the pin once the new major version has been reviewed for compatibility."
              echo
            fi

            echo "## Automated dependency update"
            echo
            echo "| | Version |"
            echo "|---|---|"
            echo "| Ruby | ${{ steps.ruby.outputs.current }} → ${{ steps.ruby.outputs.latest }} |"
            echo "| Rails | ${rails_version} |"
            echo
            echo "### Pre-update vulnerability audit"
            echo '```'
            cat /tmp/pre-audit.txt
            echo '```'
            echo
            echo "### Post-update vulnerability audit"
            echo '```'
            cat /tmp/post-audit.txt
            echo '```'
            echo
            echo "> Gems updated with \`bundle update\` within existing Gemfile constraints."
          } > /tmp/pr-body.md

          existing=$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create \
              --title "chore: update Ruby ${{ steps.ruby.outputs.current }} → ${{ steps.ruby.outputs.latest }} and gems" \
              --body-file /tmp/pr-body.md
          fi

          pr_number=$(gh pr list --head "$branch" --json number --jq '.[0].number')
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag PR for manual review
        if: steps.diff.outputs.changed == 'true' && steps.majorcheck.outputs.major_bump == 'true'
        continue-on-error: true
        run: |
          gh label create "needs-review" --color B60205 \
            --description "Blocked on a major gem version bump — needs manual review and merge" \
            --force
          gh pr edit "${{ steps.pr.outputs.number }}" \
            --add-label "needs-review" \
            --add-assignee leclaist \
            --add-reviewer leclaist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: Run CI
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.update.outputs.branch }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Security scan
        run: bin/brakeman --no-pager

      - name: Gem CVE scan
        run: bin/bundler-audit

      - name: JS CVE scan
        run: bin/importmap audit

      - name: Lint
        run: bin/rubocop -f github

      - name: Tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test

  deploy-staging:
    name: Deploy to Fly staging
    needs: [update, ci]
    runs-on: ubuntu-latest
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.update.outputs.branch }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}

  verify-staging:
    name: Verify staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test
        run: |
          echo "Waiting for staging to wake up..."
          cookies=$(mktemp)
          status=000
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -c "$cookies" -b "$cookies" https://continuation-staging.fly.dev || echo "000")
            echo "Attempt $i: HTTP $status"
            [ "$status" = "200" ] && break
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "Staging failed to return 200 after 10 attempts"
            exit 1
          fi
          echo "Staging is healthy"

          # Reuse the session cookie from above so this exercises the
          # code path that reads back an existing session, not just a
          # fresh one — that's what caught the json 3.x incompatibility.
          echo "Checking /2008 (earliest year)..."
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -c "$cookies" -b "$cookies" https://continuation-staging.fly.dev/2008)
          echo "GET /2008: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Staging /2008 failed"
            exit 1
          fi

  deploy-production:
    name: Deploy to Fly production
    needs: [update, verify-staging]
    if: needs.update.outputs.major_bump != 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.update.outputs.branch }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  merge:
    name: Merge to main
    needs: [update, verify-staging, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Merge pull request
        run: gh pr merge "${{ needs.update.outputs.pr_number }}" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  deploy-azure:
    name: Deploy to Azure
    needs: merge
    runs-on: ubuntu-latest
    concurrency: deploy-azure
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve deployed commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry continuationacr \
            --image continuation:${{ steps.sha.outputs.sha }} \
            --image continuation:latest \
            .

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name continuation \
            --resource-group continuation-rg \
            --image continuationacr.azurecr.io/continuation:${{ steps.sha.outputs.sha }}

      - name: Smoke test
        run: |
          echo "Waiting for Azure to become healthy..."
          cookies=$(mktemp)
          status=000
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 -c "$cookies" -b "$cookies" https://christineclaymoreau.lol || echo "000")
            echo "Attempt $i: HTTP $status"
            [ "$status" = "200" ] && break
            sleep 15
          done
          if [ "$status" != "200" ]; then
            echo "Azure failed to return 200 after 10 attempts"
            exit 1
          fi
          echo "Azure deployment is healthy"

          # Reuse the session cookie from above so this exercises the
          # code path that reads back an existing session, not just a
          # fresh one — that's what caught the json 3.x incompatibility.
          echo "Checking /2008 (earliest year)..."
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 -c "$cookies" -b "$cookies" https://christineclaymoreau.lol/2008)
          echo "GET /2008: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Azure /2008 failed"
            exit 1
          fi
