name: Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    concurrency: deploy-azure
    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry continuationacr \
            --image continuation:${{ github.sha }} \
            --image continuation:latest \
            .

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name continuation \
            --resource-group continuation-rg \
            --image continuationacr.azurecr.io/continuation:${{ github.sha }}

      - name: Smoke test
        run: bin/smoke https://christineclaymoreau.lol 10 15
